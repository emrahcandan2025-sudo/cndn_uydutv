name: Android Build

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK and publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing key
        run: base64 -d app/uydutv-release.jks.b64 > app/uydutv-release.jks

      - name: Build release APK
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk UyduTV-release.apk

      # Release dosyaları Actions artifact kotasından sayılmaz.
      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: UyduTV release build ${{ github.run_number }}
          prerelease: false
          files: UyduTV-release.apk

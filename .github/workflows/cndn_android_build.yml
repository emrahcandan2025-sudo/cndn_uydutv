name: CNDN Android İmzalı APK Derleme

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Derleme Hedefi'
        required: true
        default: 'assembleRelease'
        type: choice
        options:
          - assembleRelease
          - assembleDebug
          - bundleRelease
      java_version:
        description: 'Java JDK Sürümü'
        required: true
        default: '17'
        type: choice
        options:
          - '17'
          - '21'

concurrency:
  group: cndn-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android İmzalı Derleme (assembleRelease)
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Depo Kodunu Çek (Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Java JDK 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Gradle Wrapper Yetkilendirmesi ve Sürüm Uyumu
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          else
            echo "gradlew bulunamadı, fallback gradle wrapper oluşturuluyor"
            gradle wrapper --gradle-version 9.3.1 || true
            chmod +x gradlew || true
          fi
          WRAPPER_PROP="gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$WRAPPER_PROP" ]; then
            if grep -rq "9\.1\." gradle/libs.versions.toml app/build.gradle* build.gradle* 2>/dev/null; then
              echo "AGP 9.x tespit edildi. Gradle sürümü 9.3.1 olarak ayarlanıyor..."
              sed -i 's/gradle-[0-8]\.[0-9.]*-bin\.zip/gradle-9.3.1-bin.zip/g' "$WRAPPER_PROP" || true
              sed -i 's/gradle-9\.[0-2]\.[0-9.]*-bin\.zip/gradle-9.3.1-bin.zip/g' "$WRAPPER_PROP" || true
            fi
          fi

      - name: Release ve Debug Keystore Hazırla
        run: |
          echo "=== İmza Anahtarı (Keystore) Kontrolü ==="
          if [ ! -f "release.keystore" ]; then
            if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
              echo "Secret üzerinden release.keystore çözülüyor..."
              echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            elif [ -f "release.keystore.base64" ]; then
              base64 -d release.keystore.base64 > release.keystore
            else
              echo "Kalıcı ve güvenli Release Keystore keytool ile oluşturuluyor..."
              keytool -genkey -v -keystore release.keystore -storepass android -alias androidreleasekey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CNDN Release,O=CNDN,C=TR"
            fi
          fi

          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          ls -la release.keystore debug.keystore 2>/dev/null || true

      - name: Android Projesini Derle (assembleRelease)
        id: gradle_build
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'androidreleasekey' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: |
          TARGET="${{ inputs.build_target || 'assembleRelease' }}"
          ./gradlew $TARGET -Djava.awt.headless=true --stacktrace --no-daemon

      - name: Derleme Çıktısını ve İmzayı Doğrula
        if: success()
        run: |
          echo "=== Oluşan Çıktılar ==="
          ls -la app/build/outputs/apk/* 2>/dev/null || ls -la app/build/outputs/bundle/* 2>/dev/null || true
          RELEASE_APK=$(ls app/build/outputs/apk/*/*.apk 2>/dev/null | head -n 1)
          if [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
            echo "APK bulundu: $RELEASE_APK"
            if command -v apksigner >/dev/null 2>&1; then
              apksigner verify --verbose "$RELEASE_APK" || true
            else
              jarsigner -verify -verbose "$RELEASE_APK" 2>/dev/null | grep -i "verified" || true
            fi
          fi

      - name: APK / AAB Artefaktını Yükle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cndn-apk-output
          path: |
            app/build/outputs/apk/*/*.apk
            app/build/outputs/bundle/*/*.aab
          retention-days: 14
          if-no-files-found: warn